# =====================================================================
# RENDER STATIC SITE CONFIGURATION
# TRUENO FRONTEND
# =====================================================================

services:
  - type: web
    name: trueno-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trueno-backend.onrender.com/api
